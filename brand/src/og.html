<!doctype html>
<!--
  The 1200×630 share image (rendered to og-image.png), dark: the diff pair of spec §2.4a on Night,
  and the landing page's product window on the right. Open with ?shot=<file URL> to put a frame in
  the window (render-pngs.mjs passes the real hero poster, site/media/hero/poster.png).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>livelocale og-image</title>
    <style>
      @font-face {
        font-family: 'Martian Mono';
        font-weight: 500;
        src: url('../../site/node_modules/@fontsource/martian-mono/files/martian-mono-latin-500-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Martian Mono';
        font-weight: 700;
        src: url('../../site/node_modules/@fontsource/martian-mono/files/martian-mono-latin-700-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-weight: 500;
        src: url('../../site/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        src: url('../../site/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2')
          format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0c0d0f;
        color: #e8e4d9;
      }
      body {
        box-sizing: border-box;
        display: flex;
        gap: 40px;
        padding: 56px 56px 56px 64px;
      }
      .copy {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-width: 0;
      }
      .logo {
        display: block;
        height: 56px;
        width: auto;
        align-self: flex-start;
      }
      .diff {
        margin: auto 0 0;
      }
      .line {
        display: flex;
        align-items: baseline;
        gap: 0.6em;
        margin: 0;
      }
      .gutter {
        flex: none;
      }
      .old {
        font:
          500 26px/1.3 'Martian Mono',
          monospace;
        color: #6e6b64;
      }
      .old s {
        text-decoration: line-through;
      }
      h1.line {
        margin-top: 16px;
        font:
          700 44px/1.2 'Martian Mono',
          monospace;
        letter-spacing: -0.02em;
      }
      h1 .gutter {
        color: #ffb224;
      }
      .patch {
        display: inline-block;
        padding: 0 12px;
        border-radius: 10px;
        background: #ffb224;
        color: #0c0d0f;
        transform: rotate(-3deg);
        box-shadow: 4px 5px 0 #8a5600;
      }
      .bottom {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
        margin-top: auto;
      }
      code {
        white-space: nowrap;
        padding: 12px 18px;
        border-radius: 10px;
        background: #16181d;
        color: #e8e4d9;
        font:
          500 24px/1 'IBM Plex Mono',
          monospace;
      }
      .url {
        font:
          500 24px/1 'IBM Plex Mono',
          monospace;
        color: #4fc3dc;
      }
      /* The landing page's product window: Surface, a 1px Rule border, 12px radius, an address bar
         holding the Night address pill. */
      .window {
        flex: none;
        width: 600px;
        align-self: center;
        overflow: hidden;
        border: 1px solid #2a2d33;
        border-radius: 12px;
        background: #16181d;
      }
      .window-bar {
        display: flex;
        justify-content: center;
        padding: 10px 16px;
        border-bottom: 1px solid #2a2d33;
      }
      .window-address {
        width: 360px;
        padding: 5px 14px;
        border-radius: 6px;
        background: #0c0d0f;
        color: #8c887d;
        font:
          500 17px/1.2 'IBM Plex Mono',
          monospace;
        text-align: center;
        white-space: nowrap;
      }
      .addr-path {
        color: #4fc3dc;
      }
      .screen {
        aspect-ratio: 16 / 10;
        background: #0c0d0f;
      }
      .screen img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .screen img:not([src]) {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <main class="copy">
      <img class="logo" src="../logo-dark.svg" alt="livelocale" />
      <div class="diff">
        <p class="line old">
          <span class="gutter" aria-hidden="true">−</span><s>final_FINAL_v3.png</s>
        </p>
        <h1 class="line" aria-label="Stop collecting screenshots.">
          <span class="gutter" aria-hidden="true">+</span>
          <span><span class="patch">Stop</span> collecting screenshots.</span>
        </h1>
      </div>
      <div class="bottom">
        <code>npm install livelocale</code>
        <span class="url">livelocale.js.org</span>
      </div>
    </main>
    <aside class="window">
      <div class="window-bar">
        <span class="window-address"
          ><span class="addr-host">tidewell.example</span
          ><span class="addr-path">/pricing</span></span
        >
      </div>
      <div class="screen"><img id="shot" alt="" /></div>
    </aside>
    <script>
      const shot = new URLSearchParams(location.search).get('shot');
      if (shot) document.getElementById('shot').src = shot;
    </script>
  </body>
</html>

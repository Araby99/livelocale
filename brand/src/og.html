<!doctype html>
<!--
  The 1200×630 share image (rendered to og-image.png), dark: the diff pair of spec §2.4a on Night.
  Open with ?shot=<file URL> to show a Studio screenshot in the right half.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>livelocale og-image</title>
    <style>
      @font-face {
        font-family: 'Martian Mono';
        font-weight: 500;
        src: url('../../site/node_modules/@fontsource/martian-mono/files/martian-mono-latin-500-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Martian Mono';
        font-weight: 700;
        src: url('../../site/node_modules/@fontsource/martian-mono/files/martian-mono-latin-700-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-weight: 500;
        src: url('../../site/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        src: url('../../site/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2')
          format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0c0d0f;
        color: #e8e4d9;
      }
      body {
        box-sizing: border-box;
        display: flex;
        gap: 48px;
        padding: 64px 72px;
      }
      .copy {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-width: 0;
      }
      .logo {
        display: block;
        height: 56px;
        width: auto;
        align-self: flex-start;
      }
      .diff {
        margin: auto 0 0;
      }
      .line {
        display: flex;
        align-items: baseline;
        gap: 0.6em;
        margin: 0;
      }
      .gutter {
        flex: none;
      }
      .old {
        font:
          500 34px/1.3 'Martian Mono',
          monospace;
        color: #6e6b64;
      }
      .old s {
        text-decoration: line-through;
      }
      h1.line {
        margin-top: 16px;
        font:
          700 56px/1.15 'Martian Mono',
          monospace;
        letter-spacing: -0.02em;
      }
      h1 .gutter {
        color: #ffb224;
      }
      .patch {
        display: inline-block;
        padding: 0 12px;
        border-radius: 10px;
        background: #ffb224;
        color: #0c0d0f;
        transform: rotate(-3deg);
        box-shadow: 4px 5px 0 #8a5600;
      }
      .sub {
        margin: 28px 0 0;
        font:
          500 30px/1.3 'IBM Plex Sans',
          sans-serif;
        color: #8c887d;
      }
      .bottom {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 28px;
        margin-top: auto;
      }
      code {
        white-space: nowrap;
        padding: 12px 18px;
        border-radius: 10px;
        background: #16181d;
        color: #e8e4d9;
        font:
          500 26px/1 'IBM Plex Mono',
          monospace;
      }
      .url {
        font:
          500 26px/1 'IBM Plex Mono',
          monospace;
        color: #4fc3dc;
      }
      #studio {
        flex: 1;
        min-width: 0;
        align-self: center;
      }
      #studio[hidden] {
        display: none;
      }
      #studio img {
        display: block;
        width: 100%;
        border: 1px solid #2a2d33;
        border-radius: 14px;
      }
    </style>
  </head>
  <body>
    <main class="copy">
      <img class="logo" src="../logo-dark.svg" alt="livelocale" />
      <div class="diff">
        <p class="line old">
          <span class="gutter" aria-hidden="true">−</span><s>final_FINAL_v3.png</s>
        </p>
        <h1 class="line" aria-label="Stop collecting screenshots.">
          <span class="gutter" aria-hidden="true">+</span>
          <span><span class="patch">Stop</span> collecting screenshots.</span>
        </h1>
      </div>
      <p class="sub">Stop finding untranslated text on launch day.</p>
      <div class="bottom">
        <code>npx livelocale init --share</code>
        <span class="url">livelocale.js.org</span>
      </div>
    </main>
    <aside id="studio" hidden><img alt="" /></aside>
    <script>
      const shot = new URLSearchParams(location.search).get('shot');
      if (shot) {
        const studio = document.getElementById('studio');
        studio.querySelector('img').src = shot;
        studio.hidden = false;
      }
    </script>
  </body>
</html>

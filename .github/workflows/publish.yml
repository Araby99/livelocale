name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      prerelease_base:
        description: 'Publish <base>-next.<run number> to the "next" dist-tag, e.g. 0.10.0'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Needed for NPM provenance verification

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
          # No dependency cache in the release job: a cache entry written by another workflow
          # could end up in the published package. Also stops setup-node caching on its own if
          # package.json ever gains a packageManager field.
          package-manager-cache: false

      # Trusted publishing (OIDC, no NPM_TOKEN) needs npm 11.5.1 or later. Pinned to 11.x because
      # newer majors can drop support for the runner's Node version.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install Root Dependencies
        run: npm ci

      # A release tagged v1.3.0 on a commit whose package.json still says 1.2.0 would find 1.2.0
      # already on npm and go green having published nothing. Refuse it instead.
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        env: { RELEASE_TAG: '${{ github.event.release.tag_name }}' }
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::The release tag is $RELEASE_TAG, but package.json says $VERSION. Tag the release v$VERSION, or bump package.json first."
            exit 1
          fi

      # A manual run with a prerelease base publishes <base>-next.<run number> to the "next"
      # dist-tag. The version change stays in this run: no commit, no changeset, no CHANGELOG entry.
      # --ignore-scripts: the "version" lifecycle script is `changeset version`, which would consume
      # a pending changeset and turn the prerelease into a real release on "latest".
      - name: Set prerelease version
        if: inputs.prerelease_base != ''
        env: { BASE: '${{ inputs.prerelease_base }}' }
        run: npm version "$(node scripts/dist-tag.mjs prerelease "$BASE" "$GITHUB_RUN_NUMBER")" --no-git-tag-version --ignore-scripts

      # The release does not wait for CI on the tagged commit, so it runs the quick checks itself.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Library & Studio
        run: npm run build

      # The package's own tests. The site and brand tests need the site/ installs and check
      # versions a prerelease rewrites; CI and the Site workflow run them on every push.
      - name: Run Unit & Integration Tests
        run: npm run test:package

      # A version can already be on npm when it was published by hand (a new package's first
      # release has to be); then the release only records it. The warning shows on the run's
      # summary, so a release that published nothing does not pass for one that did.
      - name: Check whether this version is already published
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "livelocale@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::warning::livelocale@$VERSION is already on npm, so nothing was published."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Authenticated by npm trusted publishing for this repository and workflow file.
      - name: Publish Package to NPM
        if: steps.published.outputs.already == 'false'
        env: { PRERELEASE_BASE: '${{ inputs.prerelease_base }}' }
        run: |
          TAG=$(node scripts/dist-tag.mjs tag "$(node -p "require('./package.json').version")")
          if [ -n "$PRERELEASE_BASE" ] && [ "$TAG" != next ]; then
            echo "A prerelease run must publish to the next dist-tag, not $TAG."
            exit 1
          fi
          npm publish --provenance --tag "$TAG"

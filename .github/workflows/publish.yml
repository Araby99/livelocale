name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Needed for NPM provenance verification

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      # Trusted publishing (OIDC, no NPM_TOKEN) needs npm 11.5.1 or later. Pinned to 11.x because
      # newer majors can drop support for the runner's Node version.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Library & Studio
        run: npm run build

      - name: Run Unit & Integration Tests
        run: npm run test

      # A version can already be on npm when it was published by hand (a new package's first
      # release has to be); then the release only records it.
      - name: Check whether this version is already published
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "livelocale@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "livelocale@$VERSION is already on npm; skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Authenticated by npm trusted publishing for this repository and workflow file.
      - name: Publish Package to NPM
        if: steps.published.outputs.already == 'false'
        run: npm publish --provenance

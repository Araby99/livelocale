name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Needed for NPM provenance verification

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      # Trusted publishing (OIDC, no NPM_TOKEN) needs npm 11.5.1 or later. Pinned to 11.x because
      # newer majors can drop support for the runner's Node version.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Library & Studio
        run: npm run build

      - name: Run Unit & Integration Tests
        run: npm run test

      # Authenticated by npm trusted publishing for this repository and workflow file.
      - name: Publish Package to NPM
        run: npm publish --provenance

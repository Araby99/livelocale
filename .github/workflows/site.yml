name: Site

# Tests the landing site on every change to it, the brand or the product it packs (the demo's
# packed Studio and the CI excerpt's `check --hardcoded` output are built from src/), and on every
# release, since the docs' changelog page is CHANGELOG.md. Deploys to
# GitHub Pages only when run by hand, or on pushes once the owner sets the SITE_LIVE variable.

on:
  push:
    branches: [main]
    paths: ['site/**', 'brand/**', 'src/**', 'package.json', 'package-lock.json', 'CHANGELOG.md', '.github/workflows/site.yml']
  pull_request:
    branches: [main]
    paths: ['site/**', 'brand/**', 'src/**', 'package.json', 'package-lock.json', 'CHANGELOG.md', '.github/workflows/site.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Library & Studio
        run: npm run build

      - name: Install Site Dependencies
        run: npm ci --prefix site

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Run Site E2E Tests
        run: npm run test:site

  # The mobile Lighthouse gate (median of 3 runs on the landing and getting-started pages). It runs
  # on its own and deploy does not wait on it until the first CI medians are measured on the
  # hidden-preview run; going live waits on this job being green there.
  lighthouse:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Library & Studio
        run: npm run build

      - name: Install Site Dependencies
        run: npm ci --prefix site

      # The gate serves site/dist under /livelocale/, so it measures a build on that base.
      - name: Build Site
        run: npm run site:build
        env:
          SITE_URL: http://localhost:4174/livelocale/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse Gate
        run: npm run lighthouse --prefix site

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.SITE_LIVE == 'true')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Library & Studio
        run: npm run build

      - name: Install Site Dependencies
        run: npm ci --prefix site

      - name: Build Site
        run: npm run site:build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://araby99.github.io/livelocale/' }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | livelocale</title>
    <meta
      name="description"
      content="This address is not a livelocale page. Go to the livelocale home page or read the docs."
    />
    <meta name="theme-color" content="#0C0D0F" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="module" src="/src/not-found.ts"></script>
  </head>
  <body>
    <!--
    GitHub Pages serves this page for any address under the site that has no file, the docs'
    included, so every link here is absolute from the site base (%BASE_URL%).
    -->
    <header class="site-header">
      <div class="col">
        <a class="brand" href="%BASE_URL%" aria-label="livelocale home">
          <svg
            viewBox="0 0 64 64"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
            focusable="false"
          >
            <g fill="#E8E4D9">
              <rect x="6" y="11" width="20" height="8" rx="4" />
              <rect x="29" y="11" width="29" height="8" rx="4" />
              <rect x="6" y="28" width="14" height="8" rx="4" />
              <rect x="25" y="31" width="29" height="2" rx="1" opacity=".5" />
              <rect x="6" y="45" width="23" height="8" rx="4" />
              <rect x="32" y="45" width="12" height="8" rx="4" />
            </g>
            <g transform="rotate(-7 39 32)">
              <rect x="24.5" y="24.5" width="30" height="15" rx="4.5" fill="#8A5600" />
              <rect x="23" y="23" width="30" height="15" rx="4.5" fill="#FFB224" />
            </g>
          </svg>
          <span class="brand-name">livelocale</span>
        </a>
        <nav class="site-nav" aria-label="Main">
          <ul>
            <li><a href="https://github.com/Araby99/livelocale">GitHub</a></li>
            <li><a href="%BASE_URL%docs/">Docs</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="col not-found">
      <h1>Page not found</h1>
      <div class="pair" data-testid="not-found-pair">
        <p class="d-del">
          <span class="d-sign" aria-hidden="true">−</span
          ><del
            ><span class="sr-only">Not found: </span
            ><span data-missing-path>this address</span></del
          >
        </p>
        <p class="d-add">
          <span class="d-sign" aria-hidden="true">+</span
          ><ins><span class="sr-only">Instead: </span>the home page or the docs</ins>
        </p>
      </div>
      <p>There is no page at this address. The link may be old, or the page may have moved.</p>
      <p class="start-links">
        <a href="%BASE_URL%">Go to the home page</a>
        <a href="%BASE_URL%docs/">Read the docs</a>
      </p>
    </main>

    <footer class="site-footer">
      <div class="col footer-inner">
        <span class="footer-name">livelocale</span>
        <ul class="footer-links">
          <li><a href="https://github.com/Araby99/livelocale">GitHub</a></li>
          <li><a href="https://www.npmjs.com/package/livelocale">npm</a></li>
          <li><a href="%BASE_URL%docs/">Docs</a></li>
        </ul>
      </div>
    </footer>
  </body>
</html>
